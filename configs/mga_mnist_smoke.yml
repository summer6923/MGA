# Execution regression test, NOT a replacement for the paper benchmark.
general:
  base_path: .
clients:
  type: simple
  total_clients: 8
  per_round: 3
  random_seed: 23
  speed_simulation: false
  sleep_simulation: false
  data_deletion_round: 5
  clients_requesting_deletion: [1, 2, 3, 4]
  deleted_data_ratio: 1.0
  backdoor_enabled: true
  backdoor_poison_rate: 0.8
  backdoor_target_label: 1
  backdoor_seed: 23
  backdoor_trigger: invert
server:
  address: 127.0.0.1
  port: 39001
  synchronous: false
  simulate_wall_time: true
  minimum_clients_aggregated: 2
  clusters: 2
  do_optimized_clustering: false
  do_test: true
  do_clustered_test: true
  do_global_test: false
  staleness_bound: 1000
  window_size: 3
  skip_cluster_rollback_after_deletion: true
  exclude_delete_clients_after_deletion: true
  retained_fedavg_after_deletion: true
  retained_recovery_epochs_after_deletion: 1
  mga_request_timeout: 300
trainer:
  type: basic
  model_name: lenet5
  optimizer: SGD
  random_seed: 23
  epochs: 1
  batch_size: 50
  rounds: 8
  max_concurrency: 1
  target_accuracy: 1.1
  target_accuracy_std: 0.005
  force_stop_at_rounds: true
  unlearning_strategy: mga
  mga_enabled: true
  mga_forget_scope: client
  mga_radius: 0.5
  mga_lr: 0.02
  dynamic_e_min: 1
  dynamic_e_max: 3
  avg_mode: weighted_pth_rec
data:
  datasource: MNIST
  sampler: noniid
  partition_size: 200
  random_seed: 23
algorithm:
  type: fedavg
parameters:
  model:
    num_classes: 10
  optimizer:
    lr: 0.03
    momentum: 0.9
    weight_decay: 0.0
results:
  result_path: results
  types: round, elapsed_time, accuracy, clusters_accuracy
