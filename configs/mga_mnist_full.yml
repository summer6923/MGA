# Exact scientific settings of the validated 98.09% run; output paths made relative.
general:
  base_path: .
clients:
  type: simple
  speed_simulation: false
  simulation_distribution:
    distribution: pareto
    alpha: 1
  max_sleep_time: 0
  sleep_simulation: false
  avg_training_time: 0
  random_seed: 23
  total_clients: 100
  per_round: 5
  data_deletion_round: 10
  clients_requesting_deletion:
  - 1
  - 10
  - 20
  - 30
  - 40
  - 50
  - 60
  - 70
  - 80
  - 90
  deleted_data_ratio: 0.1
  backdoor_enabled: true
  backdoor_poison_rate: 0.8
  backdoor_target_label: 1
server:
  address: 127.0.0.1
  port: 28123
  random_seed: 23
  ping_timeout: 36000
  ping_interval: 36000
  synchronous: false
  simulate_wall_time: true
  do_test: true
  do_clustered_test: true
  do_global_test: false
  staleness_bound: 1000
  window_size: 3
  minimum_clients_aggregated: 5
  do_optimized_clustering: false
  clusters: 5
  checkpoint_path: checkpoints
  model_path: models
  group_seed: 23
  grouping_method: random
  retained_fedavg_after_deletion: true
  skip_cluster_rollback_after_deletion: true
  retained_recovery_epochs_after_deletion: 10
  retained_recovery_lr_after_deletion: 0.012
  exclude_delete_clients_after_deletion: true
data:
  datasource: MNIST
  partition_size: 2000
  sampler: noniid
  test_sampler: noniid
  random_seed: 23
trainer:
  type: basic
  epochs: 2
  batch_size: 10
  optimizer: SGD
  model_name: lenet5
  rounds: 20
  max_concurrency: 2
  target_accuracy: 0.99
  target_accuracy_std: 0.005
  unlearning_negate_loss: true
  avg_mode: weighted_pth_rec
  force_stop_at_rounds: true
  unlearning_strategy: knot
  unlearning_window: 5
  dynamic_e_min: 1
  unlearning_lr_scale: 0.066
  unlearning_min_batches: 8
  unlearning_grad_clip: 5.0
  fixed_unlearning_epochs: 4
  dynamic_e_max: 4
  mga_enabled: true
  mga_forget_scope: client
  mga_radius: 0.5
  mga_lr: 0.0007920000000000001
  random_seed: 23
parameters:
  model:
    num_classes: 10
  optimizer:
    lr: 0.012
    momentum: 0.9
    weight_decay: 0.0
algorithm:
  type: fedavg
results:
  types: round, elapsed_time, accuracy, clusters_accuracy
  result_path: results
